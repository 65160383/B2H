<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>B2H — ร้านค้า</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa
    }
  </style>
  <style>
    .rating-stars {
      font-weight: 700;
      color: #f39c12;
      font-size: 1.05rem;
    }

    #sellerRating {
      gap: 6px;
      font-size: 0.95rem
    }

    .rating-value {
      font-weight: 700;
      font-size: 1rem;
    }

    .rating-icon {
      color: #e74c3c;
      margin-right: 6px;
      font-size: 1.05rem;
    }

    .rating-number {
      color: #e74c3c;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .rating-total {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-left: 0px;
    }

    .rating-stars-row {
      display: flex;
      gap: 4px;
      align-items: center
    }

    .rating-star {
      font-size: 0.95rem;
      color: #f39c12
    }

    .rating-star.empty {
      color: #e9ecef
    }

    .seller-rating-link {
      color: #707070;
      text-decoration: underline;
      cursor: pointer
    }

    .seller-rating-link:hover {
      color: #0b5ed7
    }

    .review-avatar {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 12px
    }

    .review-product-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      margin-left: 12px
    }
  </style>
  <style>
    .fav-icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      margin-right: 6px
    }

    .fav-on {
      fill: #e74c3c;
      stroke: #e74c3c
    }

    .fav-off {
      fill: #ffffff;
      stroke: #e74c3c
    }

    @media (max-width:576px) {
      .fav-text {
        display: none
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">B2H</a>
      <div class="d-flex align-items-center">
        <div id="sellerNav" class="me-3"></div>
        <div id="sellerControls"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="mb-3">
      <h3 id="sellerTitle">ร้านค้า</h3>
    </div>

    <div id="sellerProducts" class="row g-3"></div>

    <!-- Product Detail Modal -->
    <div class="modal fade" id="productDetailModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detailTitle">รายละเอียดสินค้า</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="detailImages" class="mb-2 d-flex flex-wrap gap-2"></div>
            <p class="mb-2"><strong>ชื่อสินค้า:</strong> <span id="detailProductTitle"></span></p>
            <p class="mb-1"><strong>หมวดหมู่:</strong> <span id="detailCategory"></span></p>
            <p class="mb-1"><strong>ราคา:</strong> <span id="detailPrice"></span></p>
            <p class="mb-1"><strong>ติดต่อ:</strong> <span id="detailContact"></span></p>
            <hr>
            <p class="mb-0" id="detailDescription"></p>
          </div>
          <div class="modal-footer">
            <div class="me-auto">
              <button id="detailEditBtn" type="button" class="btn btn-outline-secondary me-2"
                style="display:none;">แก้ไข</button>
              <button id="detailReviewBtn" type="button" class="btn btn-outline-success me-2"
                style="display:none;">รีวิว</button>
              <button id="detailFavBtn" type="button" class="btn btn-outline-danger">
                <svg class="fav-icon fav-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path
                    d="M12 21s-7.5-4.9-10-7.3C-1 9.6 3 4 7.2 6.1 9.1 7.2 10 9 12 10.5c2-1.5 2.9-3.3 4.8-4.4C21 4 25 9.6 22 13.7 19.5 16.1 12 21 12 21z"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="fav-text">เพิ่มสินค้าที่ชอบ</span>
              </button>
            </div>
            <button id="detailDeleteBtn" type="button" class="btn btn-outline-danger me-2"
              style="display:none;">ลบ</button>
            <button id="detailInterestBtn" type="button" class="btn btn-outline-primary me-2"
              style="display:none;">สนใจ</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Interested Modal -->
  <div class="modal fade" id="interestedModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">คนที่สนใจสินค้าของฉัน</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="interestedList" class="list-group"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reviews Modal (show comments when clicking rating) -->
  <div class="modal fade" id="reviewsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">รีวิวผู้ขาย</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="reviewsList"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function escapeHtml(s) { return (s || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'); }

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadSeller(sellerId) {
      if (!sellerId) {
        document.getElementById('sellerTitle').textContent = 'ร้านค้าไม่ถูกต้อง';
        return;
      }
      try {
        const res = await fetch('/api/seller/' + encodeURIComponent(sellerId) + '/products');
        const data = await res.json();
        if (!data.success) {
          document.getElementById('sellerTitle').textContent = 'ไม่สามารถโหลดข้อมูลร้านค้าได้';
          return;
        }
        const seller = data.seller || {};
        const title = [seller.first_name, seller.last_name].filter(Boolean).join(' ') || seller.email || 'ร้านค้า';
        document.getElementById('sellerTitle').textContent = title;

        // seller nav: avatar + contact buttons
        const nav = document.getElementById('sellerNav');
        nav.innerHTML = '';
        if (seller && (seller.profile_image || seller.email)) {
          const avatar = seller.profile_image ? `<img src="${escapeHtml(seller.profile_image)}" alt="Avatar" style="width:40px;height:40px;object-fit:cover;border-radius:50%;margin-right:8px;">` : '';
          // sellerRating will be filled after fetching reviews
          nav.innerHTML = `<div class="d-flex align-items-center">
            ${avatar}
            <div>
              <div class="fw-bold">${escapeHtml(title)}</div>
              <div class="text-muted small">${escapeHtml(seller.email || '')}</div>
            </div>
            <div id="sellerRating" class="ms-3 text-smaller text-muted" style="cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px">
              <a id="sellerRatingLabel" class="seller-rating-link small" role="button" tabindex="0">คะแนนรีวิวร้านค้า</a>
              <div class="d-flex align-items-center">
                <div class="rating-value">—</div>
                <div class="rating-stars-row ms-2"></div>
              </div>
              <div class="rating-count"></div>
            </div>
          </div>`;

          // Fetch reviews for this seller to compute average rating and count
          (async function () {
            try {
              const revRes = await fetch('/api/seller/' + encodeURIComponent(seller.user_id || seller.userId || seller.user_id || getQueryParam('seller_id') || '') + '/reviews');
              const revData = await revRes.json();
              if (revData && revData.success) {
                const reviews = revData.reviews || [];
                const count = reviews.length;
                let avg = 0;
                if (count) {
                  const s = reviews.reduce((acc, r) => acc + (Number(r.rating) || 0), 0);
                  avg = Math.round((s / count) * 10) / 10; // one decimal
                }
                const ratingEl = document.getElementById('sellerRating');
                if (ratingEl) {
                  ratingEl.querySelector('.rating-value').textContent = count ? `${avg}` : 'ยังไม่มีรีวิว';
                  ratingEl.querySelector('.rating-value').innerHTML = count ? `<span class="rating-icon">★</span><span class="rating-number">${avg}</span>` : 'ยังไม่มีรีวิว';
                  // format total reviewers like 50k
                  function fmt(n) {
                    if (!n) return '0';
                    if (n >= 1000000) return Math.round(n / 1000000 * 10) / 10 + 'M';
                    if (n >= 1000) return Math.round(n / 1000) + 'k';
                    return String(n);
                  }
                  ratingEl.querySelector('.rating-count').innerHTML = count ? `<span class="rating-total">(การให้คะแนนทั้งหมด ${fmt(count)})</span>` : '';
                  // render five stars under the numeric rating
                  const starsRow = ratingEl.querySelector('.rating-stars-row');
                  if (starsRow) {
                    const filled = count ? Math.round(Number(avg) || 0) : 0;
                    const parts = [];
                    for (let i = 1; i <= 5; i++) {
                      if (i <= filled) parts.push('<span class="rating-star">★</span>');
                      else parts.push('<span class="rating-star empty">★</span>');
                    }
                    starsRow.innerHTML = parts.join('');
                  }
                  // open modal to show comments when clicked
                  ratingEl.setAttribute('role', 'button');
                  ratingEl.tabIndex = 0;
                  ratingEl.onclick = () => showReviewsModal(reviews, title);
                  ratingEl.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ratingEl.click(); } };
                }
              }
            } catch (e) {
              // ignore review fetch errors
            }
          })();
        }

        const container = document.getElementById('sellerProducts');
        container.innerHTML = '';
        let products = data.products || [];
        // By default hide sold items from the seller listing in the UI.
        const showSold = getQueryParam('show_sold') === '1' || String(getQueryParam('show_sold')).toLowerCase() === 'true';
        if (!showSold) {
          products = products.filter(p => String(p.status || '') !== 'sold');
        }
        if (!products.length) {
          container.innerHTML = '<div class="col-12"><div class="alert alert-info">ยังไม่มีสินค้าจากผู้ขายนี้</div></div>';
          return;
        }

        products.forEach(item => {
          const col = document.createElement('div'); col.className = 'col-md-4';
          col.innerHTML = `
            <div class="card h-100 product-card" data-product-id="${escapeHtml(String(item.product_id))}" style="cursor:pointer;">
              ${item.img_url ? `<img src="${escapeHtml(item.img_url)}" class="card-img-top" style="object-fit:cover;height:200px;">` : ''}
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${escapeHtml(item.title)}</h5>
                <p class="card-text text-muted mb-2 flex-grow-1">${escapeHtml(item.description || '')}</p>
                <p class="mb-1"><strong>ราคา:</strong> ${escapeHtml(item.price)}</p>
                <p class="mb-0"><strong>ติดต่อ:</strong> ${escapeHtml(item.contact || '-')}</p>
              </div>
            </div>
          `;
          container.appendChild(col);
        });

        // click handler to open product detail modal
        container.addEventListener('click', (e) => {
          let el = e.target;
          while (el && el !== container && !el.classList.contains('product-card')) el = el.parentElement;
          if (el && el.classList.contains('product-card')) {
            const id = el.getAttribute('data-product-id');
            if (id) openProductDetail(id);
          }
        });
      } catch (err) {
        document.getElementById('sellerTitle').textContent = 'เกิดข้อผิดพลาดในการโหลด';
      }
    }

    const tokenKey = 'b2h_token';
    async function openProductDetail(productId) {
      if (!productId) return;
      try {
        const res = await fetch('/api/products/' + encodeURIComponent(productId));
        const data = await res.json();
        if (!data.success || !data.product) { alert(data.message || 'ไม่พบข้อมูลสินค้า'); return; }
        const p = data.product;

        document.getElementById('detailTitle').textContent = (p.seller_name || '').trim() || 'รายละเอียดสินค้า';
        document.getElementById('detailProductTitle').textContent = p.title || '-';
        document.getElementById('detailCategory').textContent = p.category || '-';
        document.getElementById('detailPrice').textContent = (p.price != null ? p.price : '-');
        document.getElementById('detailContact').textContent = p.contact || '-';
        document.getElementById('detailDescription').textContent = p.description || '';

        const imagesContainer = document.getElementById('detailImages');
        imagesContainer.innerHTML = '';
        const images = p.images || [];
        if (images.length) {
          images.forEach((url) => {
            const img = document.createElement('img');
            img.src = url; img.alt = 'Product image'; img.style.width = '150px'; img.style.height = '150px'; img.style.objectFit = 'cover'; img.className = 'border rounded';
            imagesContainer.appendChild(img);
          });
        } else if (p.img_url) {
          const img = document.createElement('img'); img.src = p.img_url; img.alt = 'Product image'; img.style.width = '150px'; img.style.height = '150px'; img.style.objectFit = 'cover'; img.className = 'border rounded'; imagesContainer.appendChild(img);
        } else {
          const span = document.createElement('span'); span.textContent = 'ไม่มีรูปภาพสินค้า'; imagesContainer.appendChild(span);
        }

        // favorite button state (heart icon + text)
        const favBtn = document.getElementById('detailFavBtn');
        let isFav = false;
        if (favBtn) {
          try {
            // If current user is the seller, hide favorite button (can't favorite own product)
            const meToken = localStorage.getItem(tokenKey);
            if (meToken) {
              try {
                const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + meToken } });
                const meData = await meRes.json();
                if (meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(p.seller_id)) {
                  favBtn.style.display = 'none';
                }
              } catch (e) {
                // ignore
              }
            }

            // If not hidden, proceed with regular favorite logic
            if (favBtn.style.display !== 'none') {
              const favIcon = favBtn.querySelector('.fav-icon');
              const favText = favBtn.querySelector('.fav-text');
              favBtn.disabled = true;
              if (favText) favText.textContent = 'กำลังโหลด...';
              try {
                const token = localStorage.getItem(tokenKey);
                if (token) {
                  const favRes = await fetch('/api/favorites', { headers: { 'Authorization': 'Bearer ' + token } });
                  const favData = await favRes.json();
                  if (favData.success && Array.isArray(favData.products)) {
                    isFav = favData.products.some(p => String(p.product_id) === String(productId));
                  }
                }
              } catch (e) {
                // ignore
              }
              favBtn.disabled = false;
              if (favText) favText.textContent = 'เพิ่มสินค้าที่ชอบ';
              // keep heart icon appearance unchanged
              // toggle whole button color
              favBtn.classList.toggle('btn-danger', isFav);
              favBtn.classList.toggle('btn-outline-danger', !isFav);
              favBtn.onclick = async () => {
                const token = localStorage.getItem(tokenKey);
                if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อใช้งาน'); return; }
                try {
                  favBtn.disabled = true;
                  if (favText) favText.textContent = 'กำลังเปลี่ยน...';
                  const r = await fetch('/api/favorites/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                  const jr = await r.json();
                  if (jr.success) {
                    isFav = !!jr.added;
                    // keep heart icon appearance unchanged
                    // toggle whole button color
                    favBtn.classList.toggle('btn-danger', isFav);
                    favBtn.classList.toggle('btn-outline-danger', !isFav);
                    if (favText) favText.textContent = 'เพิ่มสินค้าที่ชอบ';
                  } else {
                    alert(jr.message || 'ไม่สามารถเปลี่ยนสถานะได้');
                  }
                } catch (err) {
                  alert('เกิดข้อผิดพลาด');
                } finally {
                  favBtn.disabled = false;
                }
              };
            }
          } catch (e) {
            // fallback: show button
            favBtn.style.display = '';
          }
        }

        // Edit button: show (and redirect to dashboard edit) if current user is the seller
        const editBtn = document.getElementById('detailEditBtn');
        if (editBtn) {
          try {
            editBtn.style.display = 'none';
            const meToken = localStorage.getItem(tokenKey);
            if (meToken) {
              const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + meToken } });
              const meData = await meRes.json();
              if (meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(p.seller_id)) {
                editBtn.style.display = '';
                editBtn.onclick = () => {
                  window.location.href = `/dashboard.html?edit_product_id=${encodeURIComponent(productId)}`;
                };
              }
            }
          } catch (e) {
            editBtn.style.display = 'none';
          }
        }

        // Interest button: show for non-owner products and copy contact to clipboard
        const interestBtn = document.getElementById('detailInterestBtn');
        const reviewBtn = document.getElementById('detailReviewBtn');
        if (interestBtn) {
          try {
            interestBtn.style.display = 'none';
            const meToken = localStorage.getItem(tokenKey);
            if (meToken) {
              const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + meToken } });
              const meData = await meRes.json();
              if (!(meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(p.seller_id))) {
                interestBtn.style.display = '';
                interestBtn.onclick = async () => {
                  const token = localStorage.getItem(tokenKey);
                  if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อใช้งาน'); return; }
                  try {
                    interestBtn.disabled = true;
                    const r = await fetch('/api/interests/add', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                    if (r.status === 404) {
                      const r2 = await fetch('/api/interests/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                      const jr2 = await r2.json();
                      if (jr2.success) {
                        alert(jr2.removed ? 'ลบความสนใจแล้ว' : 'บันทึกความสนใจเรียบร้อยแล้ว');
                      } else alert(jr2.message || 'ไม่สามารถบันทึกได้');
                    } else {
                      const jr = await r.json();
                      if (jr.success) {
                        if (jr.added) alert('บันทึกความสนใจเรียบร้อยแล้ว');
                        else alert('คุณได้แสดงความสนใจสินค้านี้แล้ว');
                      } else {
                        alert(jr.message || 'ไม่สามารถบันทึกได้');
                      }
                    }
                  } catch (e) { alert('เกิดข้อผิดพลาด'); }
                  finally { interestBtn.disabled = false; }
                };
              }
            } else {
              // not logged in: still allow user to view contact via prompt
              const contact = (p.contact || '').trim();
              if (contact) {
                interestBtn.style.display = '';
                interestBtn.onclick = () => { try { navigator.clipboard.writeText(contact); alert('คัดลอกข้อมูลติดต่อ: ' + contact); } catch (e) { window.prompt('คัดลอกข้อมูลติดต่อนี้:', contact); } };
              }
            }
          } catch (e) {
            interestBtn.style.display = 'none';
          }
        }

        // Review button: show only if product is sold and current user is the buyer
        if (reviewBtn) {
          try {
            reviewBtn.style.display = 'none';
            const meToken = localStorage.getItem(tokenKey);
            if (meToken) {
              const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + meToken } });
              const meData = await meRes.json();
              if (meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(p.buyer_id) && p.status === 'sold') {
                reviewBtn.style.display = '';
                reviewBtn.onclick = async () => {
                  const ratingInput = prompt('ให้คะแนนสินค้า (1-5)', '5');
                  if (ratingInput === null) return;
                  const rating = Number(ratingInput);
                  if (Number.isNaN(rating) || rating < 1 || rating > 5) { alert('กรุณาระบุคะแนนตั้งแต่ 1 ถึง 5'); return; }
                  const comment = prompt('เขียนรีวิว (ไม่บังคับ)', '');
                  try {
                    reviewBtn.disabled = true;
                    const token = localStorage.getItem(tokenKey);
                    const res = await fetch('/api/products/' + encodeURIComponent(productId) + '/review', {
                      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                      body: JSON.stringify({ rating: rating, comment: comment })
                    });
                    const jr = await res.json();
                    if (jr.success) alert('ขอบคุณสำหรับรีวิว'); else alert(jr.message || 'ไม่สามารถส่งรีวิวได้');
                  } catch (e) { alert('เกิดข้อผิดพลาด'); }
                  finally { reviewBtn.disabled = false; }
                };
              }
            }
          } catch (e) { reviewBtn.style.display = 'none'; }
        }

        // Delete button: show for owner and attach handler (redirect or refresh seller list)
        const deleteBtn = document.getElementById('detailDeleteBtn');
        if (deleteBtn) {
          try {
            deleteBtn.style.display = 'none';
            const meToken = localStorage.getItem(tokenKey);
            if (meToken) {
              const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + meToken } });
              const meData = await meRes.json();
              if (meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(p.seller_id)) {
                deleteBtn.style.display = '';
                deleteBtn.onclick = async () => {
                  if (!confirm('ต้องการลบสินค้านี้จริงหรือไม่?')) return;
                  try {
                    deleteBtn.disabled = true;
                    const token = localStorage.getItem(tokenKey);
                    const r = await fetch('/api/products/' + encodeURIComponent(productId), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
                    const jr = await r.json();
                    if (jr.success) {
                      const modalEl = document.getElementById('productDetailModal');
                      const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                      modal.hide();
                      // reload seller products
                      loadSeller(getQueryParam('seller_id') || (meData.user && meData.user.user_id));
                    } else {
                      alert(jr.message || 'ไม่สามารถลบสินค้าได้');
                    }
                  } catch (e) { alert('เกิดข้อผิดพลาดในการลบ'); }
                  finally { deleteBtn.disabled = false; }
                };
              }
            }
          } catch (e) { deleteBtn.style.display = 'none'; }
        }

        const modalEl = document.getElementById('productDetailModal');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูลสินค้า');
      }
    }

    (async function () {
      let sellerId = getQueryParam('seller_id');
      // If no seller_id in query, try to use current logged-in user
      if (!sellerId) {
        try {
          const token = localStorage.getItem('b2h_token');
          if (token) {
            const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            if (data.loggedIn && data.user && data.user.user_id) {
              sellerId = String(data.user.user_id);
            }
          }
        } catch (e) {
          // ignore
        }
      }
      loadSeller(sellerId);
      try { renderSellerControls(sellerId); } catch (e) { }
    })();

    // Open interested modal for this seller (requires auth)
    async function openInterestedSeller(sellerId) {
      const token = localStorage.getItem(tokenKey);
      if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อดูผู้ที่สนใจ'); return; }
      try {
        const res = await fetch('/api/seller/' + encodeURIComponent(sellerId) + '/interested', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (!data.success) { alert(data.message || 'ไม่สามารถโหลดข้อมูลได้'); return; }
        const list = document.getElementById('interestedList'); list.innerHTML = '';
        const items = data.interested || [];
        if (!items.length) {
          list.innerHTML = '<div class="alert alert-info">ยังไม่มีใครแสดงความสนใจในสินค้าของคุณ</div>';
        } else {
          items.forEach(prod => {
            const item = document.createElement('div'); item.className = 'mb-3';
            const header = document.createElement('div'); header.className = 'fw-bold mb-1'; header.textContent = `${prod.title || ('สินค้ารหัส ' + prod.product_id)} (${prod.users.length || 0})`;
            item.appendChild(header);
            const ul = document.createElement('div'); ul.className = 'list-group';
            (prod.users || []).forEach(u => {
              const uel = document.createElement('div'); uel.className = 'list-group-item d-flex align-items-center';
              const avatar = u.profile_image ? `<img src="${escapeHtml(u.profile_image)}" style="width:40px;height:40px;object-fit:cover;border-radius:50%;margin-right:8px;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#ddd;margin-right:8px"></div>`;
              const contacts = [];
              if (u.contact_facebook) contacts.push('Facebook: ' + escapeHtml(u.contact_facebook));
              if (u.contact_line) contacts.push('LINE: ' + escapeHtml(u.contact_line));
              if (u.contact_instagram) contacts.push('IG: ' + escapeHtml(u.contact_instagram));
              const contactHtml = contacts.length ? `<div class="small mt-1 text-muted">${contacts.join(' | ')}</div>` : '';
              uel.innerHTML = `${avatar}<div><div class="fw-bold">${escapeHtml(u.name || u.email || '')}</div><div class="text-muted small">${escapeHtml(u.email || '')}</div>${contactHtml}</div>`;
              ul.appendChild(uel);
            });
            item.appendChild(ul);
            list.appendChild(item);
          });
        }
        const modalEl = document.getElementById('interestedModal'); const modal = new bootstrap.Modal(modalEl); modal.show();
      } catch (e) { alert('เกิดข้อผิดพลาดในการโหลดข้อมูล'); }
    }

    // When loading seller, render 'คนที่สนใจ' button for owner
    async function renderSellerControls(sellerId) {
      const container = document.getElementById('sellerControls');
      container.innerHTML = '';
      try {
        const token = localStorage.getItem(tokenKey);
        if (!token) return;
        const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const meData = await meRes.json();
        if (meData && meData.loggedIn && meData.user && String(meData.user.user_id) === String(sellerId)) {
          const btn = document.createElement('a'); btn.className = 'btn btn-outline-secondary me-2'; btn.id = 'interestedBtnSeller'; btn.textContent = '👀 คนที่สนใจ';
          btn.href = `/interested.html?seller_id=${encodeURIComponent(sellerId)}`;
          container.appendChild(btn);
        }
      } catch (e) { /* ignore */ }
    }
  </script>
  <script>
    // show reviews modal and render comments
    function showReviewsModal(reviews, sellerTitle) {
      const list = document.getElementById('reviewsList');
      list.innerHTML = '';
      if (!reviews || reviews.length === 0) {
        list.innerHTML = '<div class="alert alert-info">ยังไม่มีรีวิวจากผู้ซื้อ</div>';
      } else {
        const parts = [];
        for (const r of reviews) {
          const reviewerName = (r.reviewer_first || '') + ' ' + (r.reviewer_last || '');
          const avatar = r.reviewer_avatar ? `<img src="${escapeHtml(r.reviewer_avatar)}" class="review-avatar">` : `<div style="width:48px;height:48px;border-radius:50%;background:#ddd;margin-right:12px"></div>`;
          const productThumb = r.product_img ? `<img src="${escapeHtml(r.product_img)}" class="review-product-thumb">` : '';
          parts.push(`<div class="mb-3 d-flex align-items-start border-bottom pb-2">
            ${avatar}
            <div class="flex-grow-1">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <div class="fw-bold">${escapeHtml(reviewerName.trim() || r.reviewer_email || 'ผู้ใช้งาน')}</div>
                  <div class="small text-muted">${escapeHtml(String(r.create_time || ''))}</div>
                </div>
                <div class="text-end">
                  <div class="rating-stars">${escapeHtml(String(r.rating || ''))} ★</div>
                </div>
              </div>
              <div class="mt-2">${escapeHtml(r.comment || '')}</div>
            </div>
            <div>${productThumb}<div class="small text-muted text-center">${escapeHtml(r.product_title || '')}</div></div>
          </div>`);
        }
        list.innerHTML = parts.join('\n');
      }
      const modalEl = document.getElementById('reviewsModal');
      const modal = new bootstrap.Modal(modalEl);
      modal.show();
    }
  </script>
