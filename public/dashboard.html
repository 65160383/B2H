<!doctype html>
<html lang="th">

<head>

    <style>

    </style>
    <style>
        .fav-icon {
            width: 18px;
            height: 18px;

            margin-right: 6px

            fill: #e74c3c;

        }

            stroke: #e74c3c

                display: none

</head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tokenKey = 'b2h_token';

        let currentUser = null;
        let products = [];
        let profileImageFile = null;
        let editProductId = null;

        function updateNavUserUI() {
            const emailSpan = document.getElementById('navUser');
            const avatarImg = document.getElementById('navAvatar');
            if (!currentUser) {
                emailSpan.textContent = '';
                avatarImg.style.display = 'none';
                return;
            }
            emailSpan.textContent = currentUser.email || '';
            const imgUrl = currentUser.profile_image || '';
            if (imgUrl) {
                avatarImg.src = imgUrl;
                avatarImg.style.display = 'inline-block';
            } else {
                avatarImg.style.display = 'none';
            }
        }
        // (removed stray global button logic) — button visibility handled per-product inside openProductDetail

        function updateContactPresets() {
            const container = document.getElementById('contactPresetButtons');
            if (!container) return;
            container.innerHTML = '';
            if (!currentUser) return;

            const sources = [
                { key: 'contact_line', label: 'LINE' },
                { key: 'contact_facebook', label: 'Facebook' },
                { key: 'contact_instagram', label: 'Instagram' },
            ];

            const contactInput = document.getElementById('contact');

            sources.forEach(src => {
                const value = (currentUser[src.key] || '').trim();
                if (!value) return;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-secondary btn-sm';
                btn.textContent = src.label;
                btn.addEventListener('click', () => {
                    if (contactInput) {
                        const part = `${src.label}: ${value}`;
                        const raw = (contactInput.value || '').trim();
                        let parts = raw ? raw.split(/\s*\|\s*/).filter(Boolean) : [];
                        const index = parts.indexOf(part);
                        if (index === -1) {
                            parts.push(part);
                        } else {
                            parts.splice(index, 1);
                        }
                        contactInput.value = parts.join(' | ');
                    }
                });
                container.appendChild(btn);
            });
        }

        async function checkAuth() {
            const token = localStorage.getItem(tokenKey);
            if (!token) return location.href = '/';
            const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            if (!data.loggedIn) { localStorage.removeItem(tokenKey); return location.href = '/'; }
            currentUser = data.user;
            updateNavUserUI();
            updateContactPresets();
        }

        function getActiveFilters() {
            // categories: array of selected category values
            const cats = Array.from(document.querySelectorAll('.filter-cat:checked')).map(el => el.value);
            const priceEl = document.querySelector('input[name="priceRange"]:checked');
            const priceRange = priceEl ? priceEl.value : 'all';
            return { categories: cats, priceRange };
        }

        function priceInRange(price, range) {
            if (range === 'all') return true;
            const p = Number(price);
            if (Number.isNaN(p)) return false;
            if (range === '0-100') return p >= 0 && p <= 100;
            if (range === '101-500') return p >= 101 && p <= 500;
            if (range === '501-1000') return p >= 501 && p <= 1000;
            if (range === '1001-5000') return p >= 1001 && p <= 5000;
            if (range === '5001-') return p >= 5001;
            return true;
        }

        function renderList(filter = '') {
            const container = document.getElementById('list'); container.innerHTML = '';
            const lower = (filter || '').toLowerCase();
            const active = getActiveFilters();

            const items = products.filter(i => {
                const text = ((i.title || '') + ' ' + (i.description || '')).toLowerCase();
                if (!text.includes(lower)) return false;
                // category filter
                if (active.categories && active.categories.length) {
                    const cat = (i.category || '').trim();
                    if (!cat || active.categories.indexOf(cat) === -1) return false;
                }
                // price filter
                if (!priceInRange(i.price, active.priceRange)) return false;
                return true;
            });

            if (!items.length) return container.innerHTML = '<div class="col-12"><div class="alert alert-info">ยังไม่มีรายการสินค้า</div></div>';
            items.forEach(item => {
                const col = document.createElement('div'); col.className = 'col-md-4';
                (function () {
                    // Map known status values to Thai labels. Show status badge for any status.
                    const statusMap = { 'available': 'พร้อมขาย', 'reserved': 'จองแล้ว', 'selling': 'กำลังขาย', 'sold': 'ขายแล้ว' };
                    const status = (item.status !== undefined && item.status !== null) ? item.status : null;
                    const statusLabel = status ? (statusMap[String(status)] || escapeHtml(String(status))) : '';
                    const statusHtml = statusLabel ? `<div class="position-absolute bottom-0 end-0 m-2"><span class="badge bg-warning text-dark">${statusLabel}</span></div>` : '';
                    col.innerHTML = `
                        <div class="card h-100 product-card position-relative" data-product-id="${escapeHtml(String(item.product_id))}" style="cursor:pointer;">
                            ${item.img_url ? `<img src="${escapeHtml(item.img_url)}" class="card-img-top" style="object-fit:cover;height:200px">` : ''}
                            ${statusHtml}
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${escapeHtml(item.title)}</h5>
                                <p class="card-text text-muted mb-2 flex-grow-1">${escapeHtml(item.description || '')}</p>
                                <p class="mb-1"><strong>ราคา:</strong> ${escapeHtml(item.price)}</p>
                                <p class="mb-0"><strong>ติดต่อ:</strong> ${escapeHtml(item.contact || '-')}</p>
                            </div>
                        </div>
                    `;
                })();
                container.appendChild(col);
            });
        }

        function escapeHtml(s) { return (s || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'); }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                if (data.success) {
                    products = data.products || [];
                } else {
                    products = [];
                }
            } catch (e) {
                products = [];
            }
            renderList(document.getElementById('search').value || '');
        }

        function openProfileModal() {
            if (!currentUser) return;
            const imgEl = document.getElementById('profileImagePreview');
            const imgUrl = currentUser.profile_image || '';
            if (imgUrl) {
                imgEl.src = imgUrl;
                imgEl.style.display = 'inline-block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('profile_image').value = currentUser.profile_image || '';
            const fullName = (currentUser.name || '').trim();
            let first = '';
            let last = '';
            if (fullName) {
                const parts = fullName.split(/\s+/);
                first = parts.shift() || '';
                last = parts.join(' ');
            }
            document.getElementById('profile_first_name').value = first;
            document.getElementById('profile_last_name').value = last;
            document.getElementById('profile_email').value = currentUser.email || '';
            document.getElementById('contact_facebook').value = currentUser.contact_facebook || '';
            document.getElementById('contact_line').value = currentUser.contact_line || '';
            document.getElementById('contact_instagram').value = currentUser.contact_instagram || '';

            const modalEl = document.getElementById('profileModal');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        async function openProductDetail(productId) {
            if (!productId) return;
            try {
                const res = await fetch('/api/products/' + encodeURIComponent(productId));
                const data = await res.json();
                if (!data.success || !data.product) {
                    alert(data.message || 'ไม่พบข้อมูลสินค้า');
                    return;
                }
                const p = data.product;
                // Ensure we have currentUser (in case openProductDetail was called before auth finished)
                if (!currentUser) {
                    try {
                        const token = localStorage.getItem(tokenKey);
                        if (token) {
                            const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
                            const meData = await meRes.json();
                            if (meData && meData.loggedIn && meData.user) {
                                currentUser = meData.user;
                                try { updateNavUserUI(); updateContactPresets(); } catch (e) { }
                            }
                        }
                    } catch (e) {
                        // ignore
                    }
                }

                // Show seller name with a link to the seller's shop page
                const sellerName = (p.seller_name || '').trim() || p.seller_email || 'รายละเอียดสินค้า';
                const sellerId = p.seller_id || '';
                const titleEl = document.getElementById('detailTitle');
                // Add a Report button (รายงาน) next to ร้านค้า
                titleEl.innerHTML = `${escapeHtml(sellerName)} <a class="btn btn-sm btn-outline-primary ms-2" href="/seller.html?seller_id=${encodeURIComponent(sellerId)}">ร้านค้า</a> <button id="detailReportBtn" type="button" class="btn btn-sm btn-outline-danger ms-2">รายงาน</button>`;
                document.getElementById('detailProductTitle').textContent = p.title || '-';
                document.getElementById('detailCategory').textContent = p.category || '-';
                document.getElementById('detailPrice').textContent = (p.price != null ? p.price : '-');
                document.getElementById('detailContact').textContent = p.contact || '-';
                document.getElementById('detailDescription').textContent = p.description || '';

                const imagesContainer = document.getElementById('detailImages');
                imagesContainer.innerHTML = '';
                const images = p.images || [];
                if (images.length) {
                    images.forEach((url) => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = 'Product image';
                        img.style.width = '150px';
                        img.style.height = '150px';
                        img.style.objectFit = 'cover';
                        img.className = 'border rounded';
                        imagesContainer.appendChild(img);
                    });
                } else if (p.img_url) {
                    const img = document.createElement('img');
                    img.src = p.img_url;
                    img.alt = 'Product image';
                    img.style.width = '150px';
                    img.style.height = '150px';
                    img.style.objectFit = 'cover';
                    img.className = 'border rounded';
                    imagesContainer.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.textContent = 'ไม่มีรูปภาพสินค้า';
                    imagesContainer.appendChild(span);
                }

                // Buttons: Edit / Interest / Delete — visibility depends on whether current user is the seller
                try {
                    const editBtn = document.getElementById('detailEditBtn');
                    if (editBtn) {
                        if (currentUser && currentUser.user_id && String(currentUser.user_id) === String(sellerId)) {
                            editBtn.style.display = '';
                            editBtn.onclick = () => openEditProduct(productId);
                        } else {
                            editBtn.style.display = 'none';
                        }
                    }

                    const markSoldBtn = document.getElementById('detailMarkSoldBtn');
                    if (markSoldBtn) {
                        // Only allow seller to mark as sold when there's a buyer or the product is in reserved/selling state.
                        const canMarkSold = currentUser && currentUser.user_id && String(currentUser.user_id) === String(sellerId)
                            && (p.buyer_id || p.status === 'reserved' || p.status === 'selling');
                        if (canMarkSold) {
                            markSoldBtn.style.display = '';
                            markSoldBtn.onclick = async () => {
                                if (!confirm('ยืนยันว่าขายสินค้าชิ้นนี้เรียบร้อยแล้ว?')) return;
                                const token = localStorage.getItem(tokenKey);
                                if (!token) { alert('กรุณาเข้าสู่ระบบ'); return; }
                                try {
                                    markSoldBtn.disabled = true;
                                    const res = await fetch('/api/products/' + encodeURIComponent(productId) + '/status', {
                                        method: 'PUT',
                                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                        body: JSON.stringify({ status: 'sold' })
                                    });
                                    const jr = await res.json();
                                    if (jr.success) {
                                        const modalEl = document.getElementById('productDetailModal');
                                        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                                        modal.hide();
                                        await loadProducts();
                                        alert('ทำเครื่องหมายว่า "ขายแล้ว" เรียบร้อย');
                                    } else {
                                        alert(jr.message || 'ไม่สามารถเปลี่ยนสถานะได้');
                                    }
                                } catch (e) {
                                    alert('เกิดข้อผิดพลาด');
                                } finally { markSoldBtn.disabled = false; }
                            };
                        } else {
                            markSoldBtn.style.display = 'none';
                        }
                    }

                    const interestBtn = document.getElementById('detailInterestBtn');
                    const reviewBtn = document.getElementById('detailReviewBtn');
                    if (interestBtn) {
                        // hide interest button if item is sold
                        if (p.status === 'sold') {
                            interestBtn.style.display = 'none';
                        } else if (currentUser && currentUser.user_id && String(currentUser.user_id) === String(sellerId)) {
                            interestBtn.style.display = 'none';
                        } else {
                            interestBtn.style.display = '';
                            // determine current interest state and update label
                            let isInterested = false;
                            interestBtn.disabled = true;
                            interestBtn.textContent = 'กำลังโหลด...';
                            try {
                                const token = localStorage.getItem(tokenKey);
                                if (token) {
                                    const favRes = await fetch('/api/interests', { headers: { 'Authorization': 'Bearer ' + token } });
                                    const favData = await favRes.json();
                                    if (favData.success && Array.isArray(favData.products)) {
                                        isInterested = favData.products.some(p => String(p.product_id) === String(productId));
                                    }
                                }
                            } catch (e) {
                                // ignore
                            }
                            interestBtn.disabled = false;
                            interestBtn.textContent = isInterested ? 'ยกเลิกสนใจ' : 'สนใจ';

                            interestBtn.onclick = async () => {
                                const token = localStorage.getItem(tokenKey);
                                if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อใช้งาน'); return; }
                                try {
                                    interestBtn.disabled = true;
                                    if (isInterested) {
                                        // remove interest (toggle)
                                        const r = await fetch('/api/interests/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                                        const jr = await r.json();
                                        if (jr.success) {
                                            isInterested = false;
                                            interestBtn.textContent = 'สนใจ';
                                            // refresh product list so status badges update
                                            try { await loadProducts(); } catch (e) { }
                                            alert('ยกเลิกความสนใจเรียบร้อยแล้ว');
                                        } else {
                                            alert(jr.message || 'ไม่สามารถยกเลิกได้');
                                        }
                                    } else {
                                        // add interest
                                        const r = await fetch('/api/interests/add', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                                        if (r.status === 404) {
                                            const r2 = await fetch('/api/interests/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                                            const jr2 = await r2.json();
                                            if (jr2.success) {
                                                isInterested = !jr2.removed;
                                                interestBtn.textContent = isInterested ? 'ยกเลิกสนใจ' : 'สนใจ';
                                                alert(jr2.removed ? 'ยกเลิกความสนใจแล้ว' : 'บันทึกความสนใจเรียบร้อยแล้ว');
                                            } else alert(jr2.message || 'ไม่สามารถบันทึกได้');
                                        } else {
                                            const jr = await r.json();
                                            if (jr.success) {
                                                isInterested = !!jr.added;
                                                interestBtn.textContent = isInterested ? 'ยกเลิกสนใจ' : 'สนใจ';
                                                if (jr.added) alert('บันทึกความสนใจเรียบร้อยแล้ว');
                                                else alert('คุณได้แสดงความสนใจสินค้านี้แล้ว');
                                            } else {
                                                alert(jr.message || 'ไม่สามารถบันทึกได้');
                                            }
                                        }
                                    }
                                } catch (e) {
                                    alert('เกิดข้อผิดพลาด');
                                } finally { interestBtn.disabled = false; }
                            };
                        }
                    }

                    // Review button: show only if product status is 'sold' and current user is the buyer
                    if (reviewBtn) {
                        try {
                            reviewBtn.style.display = 'none';
                            if (p.status === 'sold' && currentUser && currentUser.user_id && String(currentUser.user_id) === String(p.buyer_id)) {
                                reviewBtn.style.display = '';
                                reviewBtn.onclick = async () => {
                                    const ratingInput = prompt('ให้คะแนนสินค้า (1-5)', '5');
                                    if (ratingInput === null) return; // cancelled
                                    const rating = Number(ratingInput);
                                    if (Number.isNaN(rating) || rating < 1 || rating > 5) { alert('กรุณาระบุคะแนนตั้งแต่ 1 ถึง 5'); return; }
                                    const comment = prompt('เขียนรีวิว (ไม่บังคับ)', '');
                                    const token = localStorage.getItem(tokenKey);
                                    if (!token) { alert('กรุณาเข้าสู่ระบบ'); return; }
                                    try {
                                        reviewBtn.disabled = true;
                                        const res = await fetch('/api/products/' + encodeURIComponent(productId) + '/review', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                                            body: JSON.stringify({ rating: rating, comment: comment })
                                        });
                                        const jr = await res.json();
                                        if (jr.success) {
                                            alert('ขอบคุณสำหรับรีวิว');
                                        } else {
                                            alert(jr.message || 'ไม่สามารถส่งรีวิวได้');
                                        }
                                    } catch (e) { alert('เกิดข้อผิดพลาด'); }
                                    finally { reviewBtn.disabled = false; }
                                };
                            }
                        } catch (e) { reviewBtn.style.display = 'none'; }
                    }

                    const deleteBtn = document.getElementById('detailDeleteBtn');
                    if (deleteBtn) {
                        if (currentUser && currentUser.user_id && String(currentUser.user_id) === String(sellerId)) {
                            deleteBtn.style.display = '';
                            deleteBtn.onclick = async () => {
                                if (!confirm('ต้องการลบสินค้านี้จริงหรือไม่?')) return;
                                const token = localStorage.getItem(tokenKey);
                                if (!token) { alert('กรุณาเข้าสู่ระบบ'); return; }
                                try {
                                    deleteBtn.disabled = true;
                                    const r = await fetch('/api/products/' + encodeURIComponent(productId), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
                                    const jr = await r.json();
                                    if (jr.success) {
                                        const modalEl = document.getElementById('productDetailModal');
                                        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                                        modal.hide();
                                        await loadProducts();
                                    } else {
                                        alert(jr.message || 'ไม่สามารถลบสินค้าได้');
                                    }
                                } catch (e) { alert('เกิดข้อผิดพลาดในการลบ'); }
                                finally { deleteBtn.disabled = false; }
                            };
                        } else {
                            deleteBtn.style.display = 'none';
                        }
                    }
                } catch (e) {
                    // ignore UI button setup errors
                }

                // favorite button state (heart icon + text)
                const favBtn = document.getElementById('detailFavBtn');
                let isFav = false;
                if (favBtn) {
                    // If current user is the seller, hide the favorite button (can't favorite own product)
                    try {
                        if (currentUser && currentUser.user_id && String(currentUser.user_id) === String(sellerId)) {
                            favBtn.style.display = 'none';
                        } else {
                            favBtn.style.display = '';
                            const favIcon = favBtn.querySelector('.fav-icon');
                            const favText = favBtn.querySelector('.fav-text');
                            favBtn.disabled = true;
                            if (favText) favText.textContent = 'กำลังโหลด...';
                            try {
                                const token = localStorage.getItem(tokenKey);
                                if (token) {
                                    const favRes = await fetch('/api/favorites', { headers: { 'Authorization': 'Bearer ' + token } });
                                    const favData = await favRes.json();
                                    if (favData.success && Array.isArray(favData.products)) {
                                        isFav = favData.products.some(p => String(p.product_id) === String(productId));
                                    }
                                }
                            } catch (e) {
                                // ignore
                            }
                            favBtn.disabled = false;
                            if (favText) favText.textContent = 'เพิ่มสินค้าที่ชอบ';
                            // update text and appearance
                            if (favText) favText.textContent = isFav ? 'เอาออกจากรายการที่ชอบ' : 'เพิ่มสินค้าที่ชอบ';
                            favBtn.classList.toggle('btn-danger', isFav);
                            favBtn.classList.toggle('btn-outline-danger', !isFav);
                            // attach toggle handler
                            favBtn.onclick = async () => {
                                const token = localStorage.getItem(tokenKey);
                                if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อใช้งาน'); return; }
                                try {
                                    favBtn.disabled = true;
                                    if (favText) favText.textContent = 'กำลังเปลี่ยน...';
                                    const r = await fetch('/api/favorites/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: productId }) });
                                    const jr = await r.json();
                                    if (jr.success) {
                                        isFav = !!jr.added;
                                        if (favText) favText.textContent = isFav ? 'เอาออกจากรายการที่ชอบ' : 'เพิ่มสินค้าที่ชอบ';
                                        favBtn.classList.toggle('btn-danger', isFav);
                                        favBtn.classList.toggle('btn-outline-danger', !isFav);
                                        try { await loadProducts(); } catch (e) { }
                                    } else {
                                        alert(jr.message || 'ไม่สามารถเปลี่ยนสถานะได้');
                                    }
                                } catch (err) {
                                    alert('เกิดข้อผิดพลาด');
                                } finally {
                                    favBtn.disabled = false;
                                }
                            };
                        }
                    } catch (e) {
                        // fallback: show button
                        favBtn.style.display = '';
                    }
                }

                // Attach handler for Report button — open full report form (modal)
                try {
                    const reportBtn = document.getElementById('detailReportBtn');
                    if (reportBtn) {
                        reportBtn.onclick = () => showReportModal(productId, sellerId);
                    }
                } catch (e) { /* ignore */ }

                const modalEl = document.getElementById('productDetailModal');
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูลสินค้า');
            }
        }

        // Open post modal in edit mode for a product
        async function openEditProduct(productId) {
            if (!productId) return alert('ไม่พบบทความสินค้าเพื่อแก้ไข');
            try {
                const res = await fetch('/api/products/' + encodeURIComponent(productId));
                const data = await res.json();
                if (!data.success || !data.product) {
                    alert(data.message || 'ไม่พบข้อมูลสินค้า');
                    return;
                }
                const p = data.product;
                document.getElementById('title').value = p.title || '';
                document.getElementById('desc').value = p.description || '';
                document.getElementById('price').value = (p.price != null ? p.price : '');
                document.getElementById('contact').value = p.contact || '';
                const catEl = document.querySelector('input[name="category"][value="' + (p.category || '') + '"]');
                if (catEl) catEl.checked = true;
                // clear file input
                const imagesInput = document.getElementById('images');
                if (imagesInput) imagesInput.value = null;

                editProductId = productId;
                const modalEl = document.getElementById('postModal');
                const modalTitle = modalEl.querySelector('.modal-title');
                if (modalTitle) modalTitle.textContent = 'แก้ไขสินค้า';
                // If product detail modal is open, hide it to avoid overlapping modals
                try {
                    const detailModalEl = document.getElementById('productDetailModal');
                    const detailModalInst = detailModalEl && bootstrap.Modal.getInstance(detailModalEl);
                    if (detailModalInst) detailModalInst.hide();
                } catch (e) {
                    // ignore if modal not present or hiding fails
                }

                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูลเพื่อแก้ไข');
            }
        }

        // Report modal (copied from history) — supports attachments
        function showReportModal(productId, sellerId) {
            const existing = document.getElementById('reportModal');
            if (existing) existing.remove();
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `
                <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">รายงานสินค้า</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label class="form-label">ประเภทปัญหา</label>
                                        <select name="category" class="form-select" required>
                                            <option value="scam">หลอกลวง/ฉ้อโกง</option>
                                            <option value="abuse">คุกคาม/ละเมิด</option>
                                            <option value="fake">สินค้าปลอม</option>
                                            <option value="other">อื่น ๆ</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">รายละเอียด</label>
                                        <textarea name="reason" class="form-control" rows="4" placeholder="อธิบายเหตุผลที่รายงาน (จำเป็น)" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">แนบรูปหลักฐาน (ถ้ามี)</label>
                                        <input type="file" name="attachments" class="form-control" accept="image/*" multiple />
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                                    <button type="submit" class="btn btn-danger">ส่งรายงาน</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(wrapper);
            const modalEl = document.getElementById('reportModal');
            const bsModal = new bootstrap.Modal(modalEl);
            bsModal.show();

            modalEl.querySelector('form').addEventListener('submit', async function (ev) {
                ev.preventDefault();
                const form = ev.target;
                const category = form.category.value;
                const reason = form.reason.value || '';
                const token = localStorage.getItem(tokenKey);
                if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อรายงาน'); return; }
                try {
                    const fd = new FormData();
                    fd.append('target_type', 'product');
                    fd.append('target_id', productId);
                    if (sellerId) fd.append('seller_id', sellerId);
                    if (productId) fd.append('product_id', productId);
                    fd.append('category', category);
                    fd.append('reason', reason);
                    const fileInput = form.querySelector('input[name="attachments"]');
                    if (fileInput && fileInput.files && fileInput.files.length) {
                        for (let i = 0; i < fileInput.files.length; i++) {
                            fd.append('attachments', fileInput.files[i]);
                        }
                    }

                    const res = await fetch('/api/products/' + encodeURIComponent(productId) + '/report', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: fd
                    });
                    const jr = await res.json();
                    if (jr && jr.success) {
                        alert('ส่งรายงานเรียบร้อยแล้ว ขอบคุณที่แจ้งให้เราทราบ');
                        bsModal.hide();
                    } else {
                        alert((jr && jr.message) || 'ไม่สามารถส่งรายงานได้');
                    }
                } catch (err) {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการส่งรายงาน');
                }
            });
        }

        document.getElementById('savePost').addEventListener('click', async () => {
            const title = document.getElementById('title').value.trim();
            if (!title) return alert('กรุณากรอกชื่อสินค้า');
            const desc = document.getElementById('desc').value.trim();
            const price = document.getElementById('price').value.trim();
            if (!price) return alert('กรุณากรอกราคา');
            const contact = document.getElementById('contact').value.trim();
            const categoryEl = document.querySelector('input[name="category"]:checked');
            const category = categoryEl ? categoryEl.value : '';
            const imagesInput = document.getElementById('images');

            const token = localStorage.getItem(tokenKey);
            if (!token) { alert('กรุณาเข้าสู่ระบบใหม่'); return location.href = '/'; }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('description', desc);
            formData.append('price', price);
            formData.append('contact', contact);
            formData.append('category', category);
            if (imagesInput && imagesInput.files) {
                for (const file of imagesInput.files) {
                    formData.append('images', file);
                }
            }

            try {
                const url = editProductId ? ('/api/products/' + encodeURIComponent(editProductId)) : '/api/products';
                const method = editProductId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.message || (editProductId ? 'ไม่สามารถบันทึกการแก้ไขได้' : 'ไม่สามารถโพสต์สินค้าได้'));
                    return;
                }
                await loadProducts();
                const modalEl = document.getElementById('postModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                document.getElementById('postForm').reset();
                // reset edit state
                editProductId = null;
                const modalTitle = modalEl.querySelector('.modal-title');
                if (modalTitle) modalTitle.textContent = 'โพสต์สินค้า';
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโพสต์สินค้า');
            }
        });

        // Reset edit state when post modal is closed
        const postModalEl = document.getElementById('postModal');
        if (postModalEl) {
            postModalEl.addEventListener('hidden.bs.modal', () => {
                editProductId = null;
                document.getElementById('postForm').reset();
                const modalTitle = postModalEl.querySelector('.modal-title');
                if (modalTitle) modalTitle.textContent = 'โพสต์สินค้า';
            });
        }

        document.getElementById('list').addEventListener('click', (e) => {
            const container = e.currentTarget;
            let el = e.target;
            while (el && el !== container && !el.classList.contains('product-card')) {
                el = el.parentElement;
            }
            if (el && el.classList.contains('product-card')) {
                const id = el.getAttribute('data-product-id');
                if (id) openProductDetail(id);
            }
        });

        document.getElementById('navUser').addEventListener('click', openProfileModal);
        document.getElementById('navAvatar').addEventListener('click', openProfileModal);

        document.getElementById('profile_image_file').addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            profileImageFile = file || null;
            const imgEl = document.getElementById('profileImagePreview');
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    imgEl.src = reader.result;
                    imgEl.style.display = 'inline-block';
                };
                reader.readAsDataURL(file);
            } else {
                const url = document.getElementById('profile_image').value.trim();
                if (url) {
                    imgEl.src = url;
                    imgEl.style.display = 'inline-block';
                } else {
                    imgEl.style.display = 'none';
                }
            }
        });

        document.getElementById('saveProfile').addEventListener('click', async () => {
            const token = localStorage.getItem(tokenKey);
            if (!token) { alert('กรุณาเข้าสู่ระบบใหม่'); return location.href = '/'; }

            const firstName = document.getElementById('profile_first_name').value.trim();
            const lastName = document.getElementById('profile_last_name').value.trim();
            const combinedName = (firstName + ' ' + lastName).trim();

            const body = {
                name: combinedName,
                profile_image: document.getElementById('profile_image').value.trim(),
                contact_facebook: document.getElementById('contact_facebook').value.trim(),
                contact_line: document.getElementById('contact_line').value.trim(),
                contact_instagram: document.getElementById('contact_instagram').value.trim(),
            };

            try {
                const res = await fetch('/api/me', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.message || 'ไม่สามารถบันทึกโปรไฟล์ได้');
                    return;
                }
                currentUser = data.user;
                updateNavUserUI();
                updateContactPresets();

                // ถ้ามีเลือกไฟล์รูปใหม่ ให้ส่งไปที่ /api/me/avatar
                if (profileImageFile) {
                    const fd = new FormData();
                    fd.append('avatar', profileImageFile);
                    const avatarRes = await fetch('/api/me/avatar', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + token,
                        },
                        body: fd,
                    });
                    const avatarData = await avatarRes.json();
                    if (avatarData.success && avatarData.user) {
                        currentUser = avatarData.user;
                        document.getElementById('profile_image').value = currentUser.profile_image || '';
                        updateNavUserUI();
                        updateContactPresets();
                    } else if (!avatarData.success) {
                        alert(avatarData.message || 'ไม่สามารถอัปโหลดรูปโปรไฟล์ได้');
                        return;
                    }
                }

                const modalEl = document.getElementById('profileModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                profileImageFile = null;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการบันทึกโปรไฟล์');
            }
        });

        document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

        // Wire filter inputs
        function setupFilterListeners() {
            const cats = Array.from(document.querySelectorAll('.filter-cat'));
            cats.forEach(el => el.addEventListener('change', () => renderList(document.getElementById('search').value || '')));
            const prices = Array.from(document.querySelectorAll('input[name="priceRange"]'));
            prices.forEach(el => el.addEventListener('change', () => renderList(document.getElementById('search').value || '')));
            const clearBtn = document.getElementById('clearFilters');
            if (clearBtn) clearBtn.addEventListener('click', () => {
                cats.forEach(c => c.checked = false);
                const pAll = document.getElementById('price_all'); if (pAll) pAll.checked = true;
                renderList(document.getElementById('search').value || '');
            });
        }

        document.getElementById('logout').addEventListener('click', async () => {
            localStorage.removeItem(tokenKey);
            await fetch('/api/logout', { method: 'POST' });
            location.href = '/';
        });

        // Favorites: open modal and load favorites
        async function openFavorites() {
            const token = localStorage.getItem(tokenKey);
            if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อดูรายการที่ชอบ'); return; }
            try {
                const res = await fetch('/api/favorites', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (!data.success) { alert(data.message || 'ไม่สามารถโหลดรายการที่ชอบได้'); return; }
                const list = document.getElementById('favoritesList'); list.innerHTML = '';
                const items = data.products || [];
                if (!items.length) { list.innerHTML = '<div class="col-12"><div class="alert alert-info">ยังไม่มีรายการที่ชอบ</div></div>'; }
                items.forEach(item => {
                    const col = document.createElement('div'); col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="card h-100">
                            ${item.img_url ? `<img src="${escapeHtml(item.img_url)}" class="card-img-top" style="object-fit:cover;height:200px;">` : ''}
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${escapeHtml(item.title)}</h5>
                                <p class="card-text text-muted mb-2 flex-grow-1">${escapeHtml(item.description || '')}</p>
                                <p class="mb-1"><strong>ราคา:</strong> ${escapeHtml(item.price)}</p>
                                <div class="mt-2 d-flex gap-2">
                                    <button class="btn btn-sm btn-primary btn-view" data-id="${escapeHtml(String(item.product_id))}">ดูสินค้า</button>
                                    <button class="btn btn-sm btn-outline-danger btn-unfav" data-id="${escapeHtml(String(item.product_id))}">ลบจากที่ชอบ</button>
                                </div>
                            </div>
                        </div>
                    `;
                    list.appendChild(col);
                });

                // attach handlers
                Array.from(document.querySelectorAll('.btn-view')).forEach(b => b.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) {
                        const modalEl = document.getElementById('favoritesModal');
                        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                        modal.hide();
                        openProductDetail(id);
                    }
                }));

                Array.from(document.querySelectorAll('.btn-unfav')).forEach(b => b.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (!id) return;
                    try {
                        const r = await fetch('/api/favorites/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ product_id: id }) });
                        const jr = await r.json();
                        if (jr.success) {
                            // refresh favorites modal
                            openFavorites();
                        } else {
                            alert(jr.message || 'ไม่สามารถลบรายการได้');
                        }
                    } catch (err) { alert('เกิดข้อผิดพลาด'); }
                }));

                const modalEl = document.getElementById('favoritesModal');
                // reuse existing modal instance and avoid re-showing if already visible
                const modal = bootstrap.Modal.getOrCreateInstance
                    ? bootstrap.Modal.getOrCreateInstance(modalEl)
                    : (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl));
                const alreadyShown = modalEl && modalEl.classList && modalEl.classList.contains('show');
                if (!alreadyShown) modal.show();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการโหลดรายการที่ชอบ');
            }
        }

        document.getElementById('favoritesBtn').addEventListener('click', openFavorites);

        // My products button: go to seller page for current user
        document.getElementById('myProductsBtn').addEventListener('click', async () => {
            if (currentUser && currentUser.user_id) {
                return window.location.href = `/seller.html?seller_id=${encodeURIComponent(currentUser.user_id)}`;
            }
            const token = localStorage.getItem(tokenKey);
            if (!token) { alert('กรุณาเข้าสู่ระบบ'); return; }
            try {
                const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data && data.user && data.user.user_id) {
                    window.location.href = `/seller.html?seller_id=${encodeURIComponent(data.user.user_id)}`;
                } else {
                    alert('ไม่พบข้อมูลผู้ใช้');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาด');
            }
        });

        // Init
        (async () => {
            await checkAuth();
            await loadProducts();
            setupFilterListeners();
            // If opened with ?edit_product_id=..., open edit modal
            try {
                const params = new URLSearchParams(window.location.search);
                const editId = params.get('edit_product_id');
                if (editId) {
                    // ensure auth loaded
                    await openEditProduct(editId);
                }
            } catch (e) {
                // ignore
            }
        })();

        // Open interested modal for current user's products
        async function openInterested() {
            const token = localStorage.getItem(tokenKey);
            if (!token) { alert('กรุณาเข้าสู่ระบบเพื่อดูผู้ที่สนใจ'); return; }
            try {
                // get current user id
                const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
                const meData = await meRes.json();
                if (!meData.loggedIn || !meData.user) { alert('กรุณาเข้าสู่ระบบ'); return; }
                const sellerId = meData.user.user_id;
                const res = await fetch('/api/seller/' + encodeURIComponent(sellerId) + '/interested', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (!data.success) { alert(data.message || 'ไม่สามารถโหลดข้อมูลได้'); return; }
                const list = document.getElementById('interestedList');
                list.innerHTML = '';
                const items = data.interested || [];
                if (!items.length) {
                    list.innerHTML = '<div class="alert alert-info">ยังไม่มีใครแสดงความสนใจในสินค้าของคุณ</div>';
                } else {
                    items.forEach(prod => {
                        const item = document.createElement('div');
                        item.className = 'mb-3';
                        const header = document.createElement('div');
                        header.className = 'fw-bold mb-1';
                        header.textContent = `${prod.title || ('สินค้ารหัส ' + prod.product_id)} (${prod.users.length || 0})`;
                        item.appendChild(header);
                        const ul = document.createElement('div');
                        ul.className = 'list-group';
                        (prod.users || []).forEach(u => {
                            const uel = document.createElement('div');
                            uel.className = 'list-group-item d-flex align-items-center';
                            const avatar = u.profile_image ? `<img src="${escapeHtml(u.profile_image)}" style="width:40px;height:40px;object-fit:cover;border-radius:50%;margin-right:8px;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#ddd;margin-right:8px"></div>`;
                            const contacts = [];
                            if (u.contact_facebook) contacts.push('Facebook: ' + escapeHtml(u.contact_facebook));
                            if (u.contact_line) contacts.push('LINE: ' + escapeHtml(u.contact_line));
                            if (u.contact_instagram) contacts.push('IG: ' + escapeHtml(u.contact_instagram));
                            const contactHtml = contacts.length ? `<div class="small mt-1 text-muted">${contacts.join(' | ')}</div>` : '';
                            uel.innerHTML = `${avatar}<div><div class="fw-bold">${escapeHtml(u.name || u.email || '')}</div><div class="text-muted small">${escapeHtml(u.email || '')}</div>${contactHtml}</div>`;
                            ul.appendChild(uel);
                        });
                        item.appendChild(ul);
                        list.appendChild(item);
                    });
                }
                const modalEl = document.getElementById('interestedModal');
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            } catch (e) {
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล');
            }
        }

        // Also allow opening the full page view
        document.getElementById('interestedBtn').addEventListener('click', () => {
            const token = localStorage.getItem(tokenKey);
            if (!token) return location.href = '/interested.html';
            // try to get user id then navigate
            (async () => {
                try {
                    const meRes = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    const meData = await meRes.json();
                    if (meData && meData.loggedIn && meData.user && meData.user.user_id) {
                        window.location.href = `/interested.html?seller_id=${encodeURIComponent(meData.user.user_id)}`;
                    } else {
                        window.location.href = '/interested.html';
                    }
                } catch (e) { window.location.href = '/interested.html'; }
            })();
        });
    </script>

</body>

</html>
